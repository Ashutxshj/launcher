<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chillispark Leads</title>
<style>
  :root {
    --bg: #0c0d10; --card: #131418; --card-h: #16171c; --line: #23252c;
    --text: #ececf0; --dim: #8a8f9a; --accent: #ff5a3c;
    --ok: #33c26a; --warn: #e0a132; --err: #e0554a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 64px 24px 80px; }
  h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.2px; }
  h1 b { color: var(--accent); font-weight: 600; }
  .recipient { color: var(--dim); font-size: 13px; margin-top: 6px; }
  .recipient b { color: var(--text); font-weight: 500; }

  .grid { margin-top: 34px; display: grid; gap: 10px;
          grid-template-columns: repeat(2, 1fr); }
  .card {
    text-align: left; cursor: pointer; background: var(--card); color: var(--text);
    border: 1px solid var(--line); border-radius: 12px; padding: 18px 18px 20px;
    display: flex; flex-direction: column; gap: 6px; transition: background .12s, border-color .12s;
  }
  .card:hover:not(:disabled) { background: var(--card-h); border-color: #34363f; }
  .card:disabled { opacity: .4; cursor: default; }
  .card .n { font-size: 11px; color: var(--dim); letter-spacing: .8px; }
  .card .name { font-size: 17px; font-weight: 600; letter-spacing: -0.2px; }
  .card .desc { font-size: 13px; color: var(--dim); }

  .status { margin-top: 26px; border: 1px solid var(--line); border-radius: 12px;
            background: var(--card); overflow: hidden; display: none; }
  .status.show { display: block; }
  .status .bar { padding: 13px 16px; display: flex; align-items: center; gap: 11px;
                 font-size: 14px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
         animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
  .logtoggle { margin-left: auto; cursor: pointer; background: transparent;
    border: 1px solid var(--line); color: var(--dim); border-radius: 7px;
    padding: 5px 11px; font-size: 12px; transition: color .12s, border-color .12s; }
  .logtoggle:hover { color: var(--text); border-color: #34363f; }
  .status pre { margin: 0; padding: 14px 16px; max-height: 300px; overflow: auto;
    border-top: 1px solid var(--line);
    font: 12px/1.5 ui-monospace, Consolas, monospace; color: #a9afba; white-space: pre-wrap; }
  .status pre.hidden { display: none; }

  #toasts { position: fixed; top: 16px; right: 16px; display: flex; flex-direction: column;
            gap: 8px; z-index: 50; width: min(92vw, 380px); }
  .toast { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
    background: var(--card); animation: slide .2s ease; }
  @keyframes slide { from { transform: translateY(-6px); opacity: 0; } }
  .toast.ok { border-color: rgba(51,194,106,.5); }
  .toast.warn { border-color: rgba(224,161,50,.5); }
  .toast.err { border-color: rgba(224,85,74,.5); }
  .toast .t { font-weight: 600; font-size: 14px; }
  .toast .d { font-size: 13px; color: var(--dim); margin-top: 3px; word-break: break-word; }
  .toast code { background: #000; color: var(--accent); padding: 1px 6px; border-radius: 5px;
                font-size: 12px; }
  .toast .x { float: right; cursor: pointer; color: var(--dim); font-size: 16px; line-height: 1; }

  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Chilli<b>spark</b> Leads</h1>
    <div class="recipient">Sent to <b id="recipient"></b></div>
    <div class="grid" id="grid"></div>
    <section class="status" id="status">
      <div class="bar">
        <span class="dot" id="dot"></span><span id="stitle">Working</span>
        <button class="logtoggle" id="logtoggle">Show logs</button>
      </div>
      <pre id="log" class="hidden"></pre>
    </section>
  </div>
  <div id="toasts"></div>

<script>
const grid = document.getElementById('grid');
const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');
const stitle = document.getElementById('stitle');
const dot = document.getElementById('dot');
const logToggle = document.getElementById('logtoggle');
let busy = false;

logToggle.onclick = () => {
  const hidden = logEl.classList.toggle('hidden');
  logToggle.textContent = hidden ? 'Show logs' : 'Hide logs';
  if (!hidden) logEl.scrollTop = logEl.scrollHeight;
};

function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function toast(kind, title, detail) {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = `<span class="x">&times;</span><div class="t">${title}</div>` +
    (detail ? `<div class="d">${detail}</div>` : '');
  el.querySelector('.x').onclick = () => el.remove();
  document.getElementById('toasts').prepend(el);
  if (kind === 'ok') setTimeout(() => el.remove(), 9000);
}

async function load() {
  const cfg = await (await fetch('/config')).json();
  document.getElementById('recipient').textContent = cfg.recipient;
  grid.innerHTML = '';
  for (const b of cfg.buttons) {
    const el = document.createElement('button');
    el.className = 'card';
    el.innerHTML = `<div class="n">OPTION ${b.id}</div>` +
      `<div class="name">${esc(b.label)}</div><div class="desc">${esc(b.subtitle)}</div>`;
    el.onclick = () => run(b);
    grid.appendChild(el);
  }
}

function setBusy(v) {
  busy = v;
  document.querySelectorAll('.card').forEach(c => c.disabled = v);
}

async function run(b) {
  if (busy) return;
  setBusy(true);
  statusEl.classList.add('show');
  dot.style.display = 'block';
  stitle.textContent = `Running ${b.label}. This can take a few minutes.`;
  logEl.textContent = '';
  let res;
  try {
    res = await (await fetch('/run/' + b.id, {method: 'POST'})).json();
  } catch (e) { toast('err', 'Could not start', e.message); setBusy(false); return; }
  if (res.error) { toast('err', 'Could not start', res.error); setBusy(false); return; }
  poll(res.job_id, b);
}

async function poll(jobId, b) {
  let data;
  try { data = await (await fetch('/status/' + jobId)).json(); }
  catch (e) { setTimeout(() => poll(jobId, b), 2000); return; }

  logEl.textContent = (data.log || []).join('\n');
  if (!logEl.classList.contains('hidden')) logEl.scrollTop = logEl.scrollHeight;

  if (data.running) { setTimeout(() => poll(jobId, b), 2000); return; }

  dot.style.display = 'none';
  stitle.textContent = `${b.label} finished.`;
  finish(data.result, b);
  setBusy(false);
}

function finish(r, b) {
  if (!r) { toast('err', b.label + ' failed', 'No result returned'); return; }

  for (const h of (r.rate_limits || [])) {
    toast('warn', `${h.provider} rate limit hit`,
      `Edit <code>${esc(h.env_path)}</code> and swap <code>${esc(h.env_key)}</code>.` +
      (h.detail ? `<br><span style="opacity:.7">${esc(h.detail)}</span>` : ''));
  }

  if (r.ok === false) {
    toast('err', b.label + ' failed', esc(r.detail || 'see the log above'));
    return;
  }
  if (!r.count) {
    toast('warn', 'No new leads this time', 'The run finished but found nothing new to send.');
    return;
  }
  if (r.mailed) {
    toast('ok', `Sent ${r.count} lead(s) to ${esc(r.recipient)}`,
      `${r.drafted} came with a ready cold-outreach draft.`);
  } else {
    toast('err', `Found ${r.count} leads but the email failed`,
      esc(r.detail || 'see the log'));
  }
}

load();
</script>
</body>
</html>
