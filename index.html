<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chillispark Leads</title>
<style>
  :root {
    --bg: #f5f3ed; --grid-line: #e4e1d6; --ink: #10162f; --card: #ffffff;
    --dim: #565d75; --accent: #f75c1e;
    --ok: #1d9e55; --warn: #c77f0e; --err: #d43d31;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink); min-height: 100vh;
    background: var(--bg);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 28px 28px;
    font: 15px/1.55 -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 64px 24px 80px; }
  h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: .5px;
       text-transform: uppercase; }
  h1 b { color: var(--accent); font-weight: 800; }
  .recipient { color: var(--dim); font-size: 13px; margin-top: 6px; }
  .recipient b { color: var(--ink); font-weight: 700; }

  .grid { margin-top: 34px; display: grid; gap: 18px;
          grid-template-columns: repeat(2, 1fr); }
  .card {
    text-align: left; cursor: pointer; background: var(--card); color: var(--ink);
    border: 2px solid var(--ink); border-radius: 0; padding: 16px 16px 18px;
    display: flex; flex-direction: column; gap: 6px;
    box-shadow: 5px 5px 0 var(--ink);
    transition: background .1s, transform .1s, box-shadow .1s;
  }
  .card:hover:not(:disabled):not(.disabled) {
    background: var(--accent);
    transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--ink);
  }
  .card:hover:not(:disabled):not(.disabled) .n,
  .card:hover:not(:disabled):not(.disabled) .desc { color: var(--ink); }
  .card:active:not(:disabled):not(.disabled) {
    transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink);
  }
  .card:disabled, .card.disabled { opacity: .45; cursor: default; pointer-events: none; }
  .card select { margin-top: 8px; width: 100%; background: #fff; color: var(--ink);
    border: 2px solid var(--ink); border-radius: 0; padding: 8px 10px;
    font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
  .card .n { font-size: 11px; font-weight: 800; color: var(--accent);
             letter-spacing: 1.2px; }
  .card .name { font-size: 16px; font-weight: 800; letter-spacing: .6px;
                text-transform: uppercase; }
  .card:hover:not(:disabled):not(.disabled) .name::after { content: " →"; }
  .card .desc { font-size: 13px; color: var(--dim); }

  .status { margin-top: 30px; border: 2px solid var(--ink); border-radius: 0;
            background: var(--card); overflow: hidden; display: none;
            box-shadow: 5px 5px 0 var(--ink); }
  .status.show { display: block; }
  .status .bar { padding: 13px 16px; display: flex; align-items: center; gap: 11px;
                 font-size: 14px; font-weight: 700; }
  .dot { width: 10px; height: 10px; background: var(--accent);
         border: 2px solid var(--ink);
         animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
  .logtoggle { margin-left: auto; cursor: pointer; background: #fff;
    border: 2px solid var(--ink); color: var(--ink); border-radius: 0;
    padding: 5px 11px; font-size: 11px; font-weight: 800; letter-spacing: .6px;
    text-transform: uppercase; box-shadow: 3px 3px 0 var(--ink);
    transition: background .1s, transform .1s, box-shadow .1s; }
  .logtoggle:hover { background: var(--accent); }
  .logtoggle:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .status pre { margin: 0; padding: 14px 16px; max-height: 300px; overflow: auto;
    border-top: 2px solid var(--ink); background: #faf9f4;
    font: 12px/1.5 ui-monospace, Consolas, monospace; color: #3c4257; white-space: pre-wrap; }
  .status pre.hidden { display: none; }

  #toasts { position: fixed; top: 16px; right: 16px; display: flex; flex-direction: column;
            gap: 10px; z-index: 50; width: min(92vw, 380px); }
  .toast { border: 2px solid var(--ink); border-radius: 0; padding: 12px 14px;
    background: var(--card); box-shadow: 4px 4px 0 var(--ink);
    animation: slide .2s ease; }
  @keyframes slide { from { transform: translateY(-6px); opacity: 0; } }
  .toast.ok { border-left: 8px solid var(--ok); }
  .toast.warn { border-left: 8px solid var(--warn); }
  .toast.err { border-left: 8px solid var(--err); }
  .toast .t { font-weight: 800; font-size: 14px; }
  .toast .d { font-size: 13px; color: var(--dim); margin-top: 3px; word-break: break-word; }
  .toast code { background: var(--ink); color: var(--accent); padding: 1px 6px;
                border-radius: 0; font-size: 12px; }
  .toast .x { float: right; cursor: pointer; color: var(--dim); font-size: 16px; line-height: 1; }

  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Chilli<b>spark</b> Leads</h1>
    <div class="recipient">Sent to <b id="recipient"></b></div>
    <div class="grid" id="grid"></div>
    <section class="status" id="status">
      <div class="bar">
        <span class="dot" id="dot"></span><span id="stitle">Working</span>
        <button class="logtoggle" id="logtoggle">Show logs</button>
      </div>
      <pre id="log" class="hidden"></pre>
    </section>
  </div>
  <div id="toasts"></div>

<script>
const grid = document.getElementById('grid');
const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');
const stitle = document.getElementById('stitle');
const dot = document.getElementById('dot');
const logToggle = document.getElementById('logtoggle');
let busy = false;

logToggle.onclick = () => {
  const hidden = logEl.classList.toggle('hidden');
  logToggle.textContent = hidden ? 'Show logs' : 'Hide logs';
  if (!hidden) logEl.scrollTop = logEl.scrollHeight;
};

function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function toast(kind, title, detail) {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = `<span class="x">&times;</span><div class="t">${title}</div>` +
    (detail ? `<div class="d">${detail}</div>` : '');
  el.querySelector('.x').onclick = () => el.remove();
  document.getElementById('toasts').prepend(el);
  if (kind === 'ok') setTimeout(() => el.remove(), 9000);
}

async function load() {
  const cfg = await (await fetch('/config')).json();
  document.getElementById('recipient').textContent = cfg.recipient;
  grid.innerHTML = '';
  for (const b of cfg.buttons) {
    // A <select> is not allowed inside a <button>, so dropdown cards are divs.
    const el = document.createElement(b.options ? 'div' : 'button');
    el.className = 'card';
    el.innerHTML = `<div class="n">OPTION ${b.id}</div>` +
      `<div class="name">${esc(b.label)}</div><div class="desc">${esc(b.subtitle)}</div>`;
    if (b.options) {
      const sel = document.createElement('select');
      sel.title = 'What to target';
      for (const n of b.options) {
        const o = document.createElement('option');
        o.value = n; o.textContent = n;
        sel.appendChild(o);
      }
      sel.onclick = e => e.stopPropagation();   // choosing must not start a run
      el.appendChild(sel);
      el.onclick = () => run(b, sel.value);
    } else {
      el.onclick = () => run(b);
    }
    grid.appendChild(el);
  }
}

function setBusy(v) {
  busy = v;
  document.querySelectorAll('.card').forEach(c => {
    c.disabled = v;                      // real buttons
    c.classList.toggle('disabled', v);   // the niche div card
  });
}

async function run(b, choice) {
  if (busy) return;
  setBusy(true);
  statusEl.classList.add('show');
  dot.style.display = 'block';
  const what = choice ? `${b.label} (${choice})` : b.label;
  stitle.textContent = `Running ${what}. This can take a few minutes.`;
  logEl.textContent = '';
  let res;
  try {
    res = await (await fetch('/run/' + b.id, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(choice ? {choice} : {}),
    })).json();
  } catch (e) { toast('err', 'Could not start', e.message); setBusy(false); return; }
  if (res.error) { toast('err', 'Could not start', res.error); setBusy(false); return; }
  poll(res.job_id, b);
}

async function poll(jobId, b) {
  let data;
  try { data = await (await fetch('/status/' + jobId)).json(); }
  catch (e) { setTimeout(() => poll(jobId, b), 2000); return; }

  logEl.textContent = (data.log || []).join('\n');
  if (!logEl.classList.contains('hidden')) logEl.scrollTop = logEl.scrollHeight;

  if (data.running) { setTimeout(() => poll(jobId, b), 2000); return; }

  dot.style.display = 'none';
  stitle.textContent = `${b.label} finished.`;
  finish(data.result, b);
  setBusy(false);
}

function finish(r, b) {
  if (!r) { toast('err', b.label + ' failed', 'No result returned'); return; }

  for (const h of (r.rate_limits || [])) {
    toast('warn', `${h.provider} rate limit hit`,
      `Edit <code>${esc(h.env_path)}</code> and swap <code>${esc(h.env_key)}</code>.` +
      (h.detail ? `<br><span style="opacity:.7">${esc(h.detail)}</span>` : ''));
  }

  if (r.ok === false) {
    toast('err', b.label + ' failed', esc(r.detail || 'see the log above'));
    return;
  }
  if (!r.count) {
    toast('warn', 'No new leads this time', 'The run finished but found nothing new to send.');
    return;
  }
  if (r.mailed) {
    toast('ok', `Sent ${r.count} lead(s) to ${esc(r.recipient)}`,
      `${r.drafted} came with a ready cold-outreach draft.`);
  } else {
    toast('err', `Found ${r.count} leads but the email failed`,
      esc(r.detail || 'see the log'));
  }
}

load();
</script>
</body>
</html>
